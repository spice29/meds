name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          mkdir -p Sources
          mv *.swift Sources/
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project MedsApp.xcodeproj \
            -scheme MedsApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MedsApp.app Payload/
          zip -qr MedsApp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MedsApp-unsigned-ipa
          path: MedsApp.ipa
